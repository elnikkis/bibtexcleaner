[project]
name = "bibtexcleaner"
version = "0.1.0"
description = "A web app and CLI tool that strips unnecessary fields from BibTeX entries and normalizes formatting"
requires-python = ">=3.13"
dependencies = [
    "bibtexparser>=1.4.4",
    "flask>=0.12.3",
    "gunicorn>=25.1.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["bibtex_schema", "cleaner", "endpoint"]

[tool.uv]
package = false
